# The comparison run: every method on two datasets with LightGBM (default config, CPU).
# Identical to the Freiburg comparison (fork_comparison/benchmark.yaml) apart from the name.

benchmark_name: fs_compare_calculco

feature_selection:
  methods: all
  total_budget: 5
  proxy_models: [lgbm]
  fs_time_limits: [3600]
  # LightGBM on all features as well: its difference between the two versions is what library
  # versions alone change, the yardstick for the feature selection runs.
  include_default: true
  no_fallback: false
  encoding_permutation_seeds: []

time_limit: 3600

experiment:
  n_random_configs: 0

task_subset:
  # small: 690 samples, 15 features, binary, categorical features with missing values
  # medium: 4424 samples, 36 features, 3 classes
  dataset_names: [credit_approval, predict_students_dropout_and_academic_success]
  split_indices: [r0f0, r0f1, r0f2]

model_jobs:
  - name: cpu
    models:
      - [LightGBM, 0]

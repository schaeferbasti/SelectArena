# Machine-specific settings for a SLURM cluster. Copy to configs/cluster.yaml (git-ignored) and
# edit, or point $SELECTARENA_CLUSTER_CONFIG / --cluster-config at your copy.

# Persistent directory reachable from every node. Results land in <workspace>/output/<benchmark_name>/.
workspace: /path/to/selectarena_workspace
# Python of the environment SelectArena is installed in, as seen from the compute nodes.
python_path: /path/to/venvs/selectarena/bin/python

# tabarena.caching.CacheConfig fields. null keeps the library default.
caches:
  openml: /path/to/cache/openml
  data_foundry: /path/to/cache/data_foundry
  huggingface: null
  tabarena: null

# Local directory with the suite's Data Foundry containers as <dataset>/<container uuid>. null
# downloads them from Hugging Face (selectarena.datasets.HF_REPO_ID) into caches.data_foundry.
data_foundry_warehouse: null

# tabflow_slurm.SlurmSetup fields.
slurm:
  gpu_partition: <gpu-partition>
  cpu_partition: <cpu-partition>
  extra_gres: null
  exclusive_node: false
  time_limit_overhead: 1
  array_job_limit: 100

# tabflow_slurm.ResourcesSetup fields (defaults: 8 CPUs, 32 GB, no GPU).
resources:
  num_cpus: 8
  memory_limit: 32

# SLURM settings for the stability/validity array jobs.
extra_benchmark_slurm:
  partition: <partition>
  cpus_per_task: 8
  mem: 32G
  time: "10:00:00"
  parallel: 100

# Machine-specific settings for an OAR cluster. Copy to configs/cluster.yaml (git-ignored) and
# edit, or point $SELECTARENA_CLUSTER_CONFIG / --cluster-config at your copy.

scheduler: oar

# Persistent directory reachable from every node. Results land in <workspace>/output/<benchmark_name>/.
workspace: /path/to/selectarena_workspace
# Python of the environment SelectArena is installed in, as seen from the compute nodes.
python_path: /path/to/venvs/selectarena/bin/python

# tabarena.caching.CacheConfig fields. null keeps the library default.
caches:
  openml: /path/to/cache/openml
  data_foundry: /path/to/cache/data_foundry
  huggingface: /path/to/cache/huggingface
  tabarena: null

# Local directory with the suite's Data Foundry containers as <dataset>/<container uuid>. null
# downloads them from Hugging Face (selectarena.datasets.HF_REPO_ID) into caches.data_foundry.
data_foundry_warehouse: null

# selectarena.benchmark.oar.OarSetup fields (main benchmark).
oar:
  cpu_resources: "/nodes=1/core={num_cpus}"
  gpu_resources: "/nodes=1/gpu={num_gpus}"
  gpu_properties: null   # -p clause for GPU jobs, e.g. "gpumodel IN ('A100','H100')"
  cpu_properties: null
  queue: null            # default queue; set besteffort: true (and queue: besteffort) for preemptible jobs
  besteffort: false
  env_script: null       # sourced before `module load` in the batch scripts, if your cluster needs one
  modules: []            # e.g. [cuda/cuda-12.1] if the GPU models need a system CUDA
  time_limit_overhead: 1 # hours added to each subjob's walltime
  scratch_root: null     # node-local scratch; null uses $TMPDIR or /tmp

# tabflow_slurm.ResourcesSetup fields (defaults: 8 CPUs, 32 GB, no GPU). OAR does not reserve
# memory: memory_limit is the budget AutoGluon / Ray are told to stay within.
resources:
  num_cpus: 8
  memory_limit: 32

# OAR settings for the stability/validity array jobs (selection only, CPU).
extra_benchmark_oar:
  resources: "/nodes=1/core=8"
  walltime: "10:00:00"
  queue: null
  properties: null
  besteffort: false
  env_script: null
  modules: []

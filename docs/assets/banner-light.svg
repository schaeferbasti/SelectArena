</svg>
  <text x="184" y="74" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-0.9"><tspan fill="#0072b2">Select</tspan><tspan fill="#1f2328">Arena</tspan></text>
